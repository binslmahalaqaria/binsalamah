<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>توقيع البريد — بن سلمه العقارية</title>
<style>
  body { margin: 0; padding: 24px 16px; background: #f4f4f4; font-family: Tahoma, Arial, sans-serif; color: #333; }
  .wrap { max-width: 640px; margin: 0 auto; }
  .card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 16px; }
  .hint { font-size: 14px; line-height: 1.9; color: #555; }
  button { background: #333; color: #fff; border: 0; border-radius: 99px; padding: 10px 22px; font: 700 14px Tahoma, Arial; cursor: pointer; }
  .ok { color: #0a7d3b; font-weight: 700; margin-inline-start: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <b>توقيع البريد الرسمي</b>
    <p class="hint">اضغط «نسخ التوقيع»، ثم الصقه (Ctrl + V) في إعدادات التوقيع في Outlook أو Zoho Mail.</p>
    <button type="button" id="copy">نسخ التوقيع</button><span class="ok" id="ok" hidden>تم النسخ ✓</span>
  </div>

  <div class="card" id="sig-box">
<!-- signature start -->
<table id="sig" dir="rtl" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Tahoma,Arial,sans-serif;color:#333333;">
  <tr>
    <td style="padding:0 0 0 18px;vertical-align:middle;">
      <a href="https://www.binslmahre.com" style="text-decoration:none;">
        <img src="https://www.binslmahre.com/brand/email-logo.png" width="110" alt="بن سلمه العقارية" style="display:block;border:0;width:110px;height:auto;">
      </a>
    </td>
    <td style="border-right:2px solid #333333;padding:2px 18px 2px 0;vertical-align:middle;font-size:13px;line-height:22px;">
      <div style="font-size:16px;font-weight:bold;color:#333333;">بن سلمه العقارية</div>
      <div style="font-size:12px;color:#888888;letter-spacing:.3px;" dir="ltr" align="right">Bin Slmah Real Estate</div>
      <div style="height:8px;line-height:8px;font-size:1px;">&nbsp;</div>
      <div>جوال: <a href="tel:+966567140388" style="color:#333333;text-decoration:none;" dir="ltr">056 714 0388</a></div>
      <div>البريد: <a href="mailto:info@binslmahre.com" style="color:#333333;text-decoration:none;">info@binslmahre.com</a></div>
      <div>الموقع: <a href="https://www.binslmahre.com" style="color:#333333;text-decoration:none;">www.binslmahre.com</a></div>
      <div style="color:#888888;">الرياض — حي النرجس، طريق عثمان بن عفان</div>
    </td>
  </tr>
</table>
<!-- signature end -->
  </div>
</div>
<script>
  document.getElementById("copy").onclick = async () => {
    const el = document.getElementById("sig");
    const html = el.outerHTML;
    try {
      await navigator.clipboard.write([new ClipboardItem({ "text/html": new Blob([html], { type: "text/html" }), "text/plain": new Blob([el.innerText], { type: "text/plain" }) })]);
    } catch {
      const r = document.createRange(); r.selectNode(el);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand("copy"); s.removeAllRanges();
    }
    document.getElementById("ok").hidden = false;
  };
</script>
</body>
</html>
